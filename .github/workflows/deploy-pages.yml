name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, claude/responsive-portfolio-website-yhv6t0]
    paths: ['portfolio/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio
